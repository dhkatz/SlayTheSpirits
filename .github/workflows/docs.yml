# Builds the docs site (docs/) and publishes it to GitHub Pages with the Actions-based deployment.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mod/src/**'
      - 'mod/tools/SlayTheSpirits.DocsExport/**'
      - 'sdk/src/SpireKit.Core/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mod/src/**'
      - 'mod/tools/SlayTheSpirits.DocsExport/**'
      - 'sdk/src/SpireKit.Core/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push supersedes a queued one, but never cancels one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      # The rules pages are generated by running the real rules engine (mod/tools/SlayTheSpirits.DocsExport).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - name: Build (generates wiki data from the mod's source first)
        run: npm run build
        env:
          DOCS_BASE: /SlayTheSpirits  # Pages serves the site from /<repo>/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
