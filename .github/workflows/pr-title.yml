# Checks that the PR title is a Conventional Commit (feat: ..., fix: ..., chore: ...). PRs are squash-merged with the
# title as the commit message, and release-please (release-please.yml) reads those to pick the next version:
# feat → minor, fix → patch, anything else is left out of the release.
#
# Release PRs that release-please opens don't run this check (PRs opened with GITHUB_TOKEN start no workflows), so
# don't make it a required check unless that's handled too.
name: PR title

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
